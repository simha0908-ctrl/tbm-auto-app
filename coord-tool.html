<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>작업계획도 좌표 조정 툴</title>
<script src="page9_base.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #1a1a2e; color: #eee; display: flex; height: 100vh; overflow: hidden; }

/* 왼쪽: 캔버스 영역 */
#canvas-wrap {
  flex: 1;
  overflow: auto;
  position: relative;
  background: #111;
}
#canvas-wrap canvas {
  display: block;
  cursor: crosshair;
}
/* 드래그 핸들 */
.handle {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: grab;
  user-select: none;
  z-index: 10;
}
.handle:active { cursor: grabbing; }
.handle-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 4px rgba(0,0,0,0.8);
}
.handle-label {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: #fff;
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 3px;
  white-space: nowrap;
  pointer-events: none;
}

/* 오른쪽: 컨트롤 패널 */
#panel {
  width: 320px;
  min-width: 320px;
  background: #16213e;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #2a2a4a;
  font-size: 15px;
  font-weight: 700;
  color: #7ec8e3;
}
#panel-header small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: #888;
  margin-top: 3px;
}
#coord-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
}
.coord-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  border-radius: 6px;
  margin-bottom: 4px;
  font-size: 12px;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: background 0.15s;
}
.coord-row:hover { background: #1f2f50; }
.coord-row.active { border-color: #7ec8e3; background: #1a2f4a; }
.coord-color {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.coord-name {
  flex: 1;
  font-weight: 600;
  color: #cde;
}
.coord-xy {
  color: #aaa;
  font-size: 11px;
  font-family: monospace;
  min-width: 110px;
  text-align: right;
}
.coord-xy input {
  width: 48px;
  background: #0d1b2a;
  border: 1px solid #334;
  border-radius: 3px;
  color: #7ef;
  font-size: 11px;
  font-family: monospace;
  padding: 2px 4px;
  text-align: center;
}
#panel-footer {
  padding: 12px 16px;
  border-top: 1px solid #2a2a4a;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#output {
  background: #0d1b2a;
  border: 1px solid #334;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 10px;
  font-family: monospace;
  color: #7ef;
  white-space: pre;
  overflow: auto;
  max-height: 180px;
  line-height: 1.6;
}
button {
  background: #1a6fbe;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}
button:hover { background: #1557a0; }
button.secondary {
  background: #2a3a4a;
}
button.secondary:hover { background: #3a4a5a; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="main-canvas"></canvas>
</div>

<div id="panel">
  <div id="panel-header">
    작업계획도 좌표 조정 툴
    <small>핸들을 드래그하거나 숫자를 직접 입력하세요</small>
  </div>
  <div id="coord-list"></div>
  <div id="panel-footer">
    <pre id="output">좌표를 조정한 뒤 [복사] 버튼을 누르세요</pre>
    <div style="display:flex;gap:6px;">
      <button onclick="renderOutput()" style="flex:1;">🔄 미리보기 갱신</button>
      <button onclick="copyOutput()" style="flex:1;">📋 좌표 복사</button>
    </div>
    <button class="secondary" onclick="resetCoords()">↺ 원래 좌표로 리셋</button>
  </div>
</div>

<script>
const SCALE = 0.5;  // 200dpi 좌표 → 827×1170 캔버스

// ── 조정 대상 좌표 (200dpi 기준) ──
// 날짜를 YY / MM / DD 세 필드로 분리
const FIELDS = [
  { key:'date_yy',    label:'날짜-년(YY)',    color:'#ff6b6b', x:400,  y:384,  fontSize:34 },
  { key:'date_mm',    label:'날짜-월(MM)',    color:'#ff9f43', x:460,  y:384,  fontSize:34 },
  { key:'date_dd',    label:'날짜-일(DD)',    color:'#feca57', x:520,  y:384,  fontSize:34 },
  { key:'time_start', label:'시작시간',        color:'#48dbfb', x:634,  y:384,  fontSize:34 },
  { key:'time_end',   label:'종료시간',        color:'#54a0ff', x:784,  y:386,  fontSize:34 },
  { key:'location',   label:'작업장소',        color:'#5f27cd', x:1100, y:386,  fontSize:34 },
  { key:'vehicle_num',label:'차량번호',        color:'#00d2d3', x:394,  y:480,  fontSize:34 },
  { key:'work_content',label:'작업내용',       color:'#ff9ff3', x:394,  y:430,  fontSize:34 },
  { key:'worker1_name',label:'작업자1',        color:'#1dd1a1', x:394,  y:528,  fontSize:34 },
  { key:'worker2_name',label:'작업자2',        color:'#26de81', x:830,  y:528,  fontSize:34 },
  { key:'worker3_name',label:'작업자3',        color:'#2bcbba', x:1266, y:528,  fontSize:34 },
];

// 샘플 표시 텍스트
const SAMPLE = {
  date_yy:    '26',
  date_mm:    '05',
  date_dd:    '03',
  time_start: '08:00',
  time_end:   '17:00',
  location:   '수원시 팔달구',
  vehicle_num:'경기12가3456',
  work_content:'배전설비안전센터 직영작업',
  worker1_name:'홍길동',
  worker2_name:'김철수',
  worker3_name:'이영희',
};

// 현재 좌표 (편집용 복사본)
const coords = FIELDS.map(f => ({ ...f }));

const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const W = 827, H = 1170;
canvas.width  = W;
canvas.height = H;

let bgImage = null;

// ── 배경 로드 ──
function loadBg() {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { bgImage = img; res(); };
    img.onerror = rej;
    img.src = typeof page9FullBase64 !== 'undefined' ? page9FullBase64 : '';
  });
}

// ── 캔버스 렌더 ──
function render() {
  ctx.clearRect(0, 0, W, H);
  if (bgImage) ctx.drawImage(bgImage, 0, 0, W, H);

  coords.forEach(f => {
    const text = SAMPLE[f.key] || f.label;
    const fs = Math.round((f.fontSize || 34) * SCALE);
    ctx.font = `bold ${fs}px "Noto Sans KR", sans-serif`;
    ctx.fillStyle = f.color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(String(text), f.x * SCALE, f.y * SCALE);
  });

  updateHandles();
}

// ── 패널 좌표 목록 생성 ──
function buildPanel() {
  const list = document.getElementById('coord-list');
  list.innerHTML = '';
  coords.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'coord-row';
    row.id = 'row-' + f.key;
    row.innerHTML = `
      <div class="coord-color" style="background:${f.color}"></div>
      <div class="coord-name">${f.label}</div>
      <div class="coord-xy">
        x<input type="number" id="ix-${f.key}" value="${f.x}" onchange="updateFromInput('${f.key}')">
        y<input type="number" id="iy-${f.key}" value="${f.y}" onchange="updateFromInput('${f.key}')">
      </div>
    `;
    row.onclick = e => { if(e.target.tagName !== 'INPUT') activateField(f.key); };
    list.appendChild(row);
  });
}

function updateFromInput(key) {
  const f = coords.find(c => c.key === key);
  if (!f) return;
  const xi = document.getElementById('ix-' + key);
  const yi = document.getElementById('iy-' + key);
  f.x = parseInt(xi.value) || f.x;
  f.y = parseInt(yi.value) || f.y;
  render();
}

// ── 드래그 핸들 ──
const handles = {};
let dragging = null;
let dragOffset = { x: 0, y: 0 };

function getCanvasRect() { return canvas.getBoundingClientRect(); }

function createHandles() {
  const wrap = document.getElementById('canvas-wrap');
  coords.forEach(f => {
    const h = document.createElement('div');
    h.className = 'handle';
    h.innerHTML = `<div class="handle-dot" style="background:${f.color}"></div><div class="handle-label">${f.label}</div>`;
    h.addEventListener('mousedown', e => startDrag(e, f.key));
    wrap.appendChild(h);
    handles[f.key] = h;
  });
}

function posHandle(key) {
  const f = coords.find(c => c.key === key);
  const h = handles[key];
  if (!f || !h) return;
  const rect = getCanvasRect();
  const wrap = document.getElementById('canvas-wrap');
  const wRect = wrap.getBoundingClientRect();
  // canvas position relative to wrap (accounting for scroll)
  const cx = rect.left - wRect.left + wrap.scrollLeft;
  const cy = rect.top  - wRect.top  + wrap.scrollTop;
  h.style.left = (cx + f.x * SCALE) + 'px';
  h.style.top  = (cy + f.y * SCALE) + 'px';
}

function updateHandles() {
  coords.forEach(f => posHandle(f.key));
}

function startDrag(e, key) {
  e.preventDefault();
  dragging = key;
  activateField(key);
  const f = coords.find(c => c.key === key);
  const rect = getCanvasRect();
  dragOffset.x = e.clientX - (rect.left + f.x * SCALE);
  dragOffset.y = e.clientY - (rect.top  + f.y * SCALE);
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
}

function onDrag(e) {
  if (!dragging) return;
  const f = coords.find(c => c.key === dragging);
  const rect = getCanvasRect();
  const nx = Math.round((e.clientX - rect.left - dragOffset.x) / SCALE);
  const ny = Math.round((e.clientY - rect.top  - dragOffset.y) / SCALE);
  f.x = Math.max(0, Math.min(1654, nx));
  f.y = Math.max(0, Math.min(2340, ny));
  const xi = document.getElementById('ix-' + dragging);
  const yi = document.getElementById('iy-' + dragging);
  if (xi) xi.value = f.x;
  if (yi) yi.value = f.y;
  render();
}

function stopDrag() {
  dragging = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
}

let activeKey = null;
function activateField(key) {
  if (activeKey) {
    const prev = document.getElementById('row-' + activeKey);
    if (prev) prev.classList.remove('active');
  }
  activeKey = key;
  const row = document.getElementById('row-' + key);
  if (row) { row.classList.add('active'); row.scrollIntoView({ block:'nearest' }); }
}

// ── 좌표 출력 ──
function renderOutput() {
  const lines = [
    '// workplanCoords 날짜/시간 관련 좌표',
    '// index.html의 workplanCoords 객체를 아래로 교체하세요',
    '',
    '// ── 날짜 (YY/MM/DD 분리) ──',
  ];
  coords.forEach(f => {
    lines.push(`  ${f.key.padEnd(14)}: { x:${String(f.x).padStart(4)}, y:${String(f.y).padStart(4)}, fontSize:${f.fontSize||34} },  // ${f.label}`);
  });
  document.getElementById('output').textContent = lines.join('\n');
}

function copyOutput() {
  renderOutput();
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ 좌표가 클립보드에 복사됐습니다!');
  });
}

const ORIGINAL = FIELDS.map(f => ({ ...f }));
function resetCoords() {
  ORIGINAL.forEach(o => {
    const f = coords.find(c => c.key === o.key);
    if (f) { f.x = o.x; f.y = o.y; }
    const xi = document.getElementById('ix-' + o.key);
    const yi = document.getElementById('iy-' + o.key);
    if (xi) xi.value = o.x;
    if (yi) yi.value = o.y;
  });
  render();
}

// ── 초기화 ──
async function init() {
  await loadBg();
  buildPanel();
  createHandles();
  render();
  renderOutput();
}

init();
</script>
</body>
</html>
